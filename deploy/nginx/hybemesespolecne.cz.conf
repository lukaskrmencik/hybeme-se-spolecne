server {
    listen 80;
    listen [::]:80;
    server_name hybemesespolecne.cz www.hybemesespolecne.cz;

    root /var/www/hybemesespolecne;
    index index.html;
    charset utf-8;

    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/ttf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;
    }

    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location ^~ /_expo/static/ {
        expires max;
        try_files $uri =404;
    }

    location ^~ /vendor/ {
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /images/ {
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
        expires -1;
    }
}
