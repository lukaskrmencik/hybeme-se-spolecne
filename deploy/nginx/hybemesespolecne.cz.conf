# /etc/nginx/sites-available/hybemesespolecne.cz  (symlinked into sites-enabled)
# HTTP only on purpose: `certbot --nginx` adds the HTTPS server and the redirect itself.
server {
    listen 80;
    listen [::]:80;
    server_name hybemesespolecne.cz www.hybemesespolecne.cz;

    # Web app (landing page + app), static files from `expo export`, copied here by deploy.sh.
    root /var/www/hybemesespolecne;
    index index.html;

    # Photo uploads go through to Laravel (the backend accepts up to 2 MB per photo).
    client_max_body_size 12M;

    # Compression: the app bundle shrinks to about a third.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/ttf;

    # Security headers, sent with every response. The locations below set caching with "expires", not
    # add_header: an add_header inside a location would make nginx drop all of these there.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # Laravel in Docker, reachable only on localhost.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;
    }

    # Uploaded photos and avatars, served by the container.
    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    # PWA: the manifest needs its own type, and neither file may be cached, otherwise phones
    # would keep an old service worker after a deploy.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    # Bundles have a content hash in their name, so they can be cached for good.
    location ^~ /_expo/static/ {
        expires max;
        try_files $uri =404;
    }

    # Leaflet and the map font, self-hosted instead of a foreign CDN.
    location ^~ /vendor/ {
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Pages: /login -> login.html, unknown paths -> the landing page. HTML is always revalidated
    # so a new deploy shows up right away.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
        expires -1;
    }
}
